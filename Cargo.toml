[package]
name = "shepherdr"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[[bin]]
name = "shepherdr"
path = "src/main.rs"

[lib]
name = "shepherdr"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
